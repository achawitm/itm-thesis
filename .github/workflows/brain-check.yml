name: brain-check
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registry, gate and audit-log validation
        run: python3 00_START_HERE/tools/brain_check.py
      - name: Tool tests
        run: python3 -m unittest discover -s 00_START_HERE/tests -v
